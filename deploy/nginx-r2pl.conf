# Cloudflare Tunnel keeps its existing loopback destinations: 4176 and 4177.
# HTTP and Colyseus WebSocket requests share the same public HTTPS origin.
map $http_upgrade $r2pl_connection {
    default upgrade;
    '' close;
}
map $http_upgrade $r2pl_production_backend {
    default http://127.0.0.1:2568;
    '' http://127.0.0.1:4190;
}
map $http_upgrade $r2pl_sandbox_backend {
    default http://127.0.0.1:2569;
    '' http://127.0.0.1:4191;
}

server {
    listen 127.0.0.1:4176;
    server_name skai0o0.id.vn;
    client_max_body_size 16k;

    # Replace PORTAL_LOGIN_URL when the verified event portal is available.
    location = /integration-login {
        root /var/www/r2pl;
        try_files /production-login.html =503;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location / {
        proxy_pass $r2pl_production_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $r2pl_connection;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}

server {
    listen 127.0.0.1:4177;
    server_name play.skai0o0.id.vn;
    client_max_body_size 16k;

    location / {
        proxy_pass $r2pl_sandbox_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $r2pl_connection;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
