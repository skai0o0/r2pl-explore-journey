<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07141c" />
    <title>R2PL 2027 — Demo</title>
    <style>
      :root { color-scheme: dark; font: 14px/1.5 system-ui, sans-serif; background: #07141c; color: #d9f2ef; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      main { position: relative; width: 100%; height: 100%; min-height: 320px; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #07141c; }
      a { position: absolute; z-index: 1; top: 12px; right: 12px; padding: 8px 12px; border: 1px solid #54d8d1; border-radius: 8px; background: #0d252d; color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid #b7f36b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <a href="https://play.skai0o0.id.vn/" target="_blank" rel="noopener noreferrer">Mở bản Demo riêng ↗</a>
      <iframe
        src="https://play.skai0o0.id.vn/"
        title="R2PL 2027 — bản Demo"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
        referrerpolicy="no-referrer"
      ></iframe>
    </main>
  </body>
</html>
