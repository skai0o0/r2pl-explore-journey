<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07141c" />
    <title>R2PL — iframe test</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: #07141c; color: #d9f2ef; font: 14px/1.4 system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 14px; border-bottom: 1px solid #20464c; }
      header strong { letter-spacing: .08em; text-transform: uppercase; }
      header a { color: #b7f36b; }
      main { min-height: 0; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: #07141c; }
    </style>
  </head>
  <body>
    <header>
      <strong>R2PL · itch.io embed test</strong>
      <a href="https://skai0o0.itch.io/explore-journey" target="_blank" rel="noopener noreferrer">Mở trang itch ↗</a>
    </header>
    <main>
      <iframe
        src="https://html-classic.itch.zone/html/19927558/index.html?v=1792595459"
        title="Explore Journey — itch.io HTML5 build"
        allow="autoplay; fullscreen *; gamepad; gyroscope; accelerometer; xr; web-share"
        allowfullscreen
        referrerpolicy="no-referrer"
      ></iframe>
    </main>
  </body>
</html>
