<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1a20" />
    <title>R2PL 2027 — Hành trình Khám phá</title>
  </head>
  <body data-school="dawn" data-debug="false">
    <main class="game-shell">
      <div id="world-view" role="application" aria-label="Bản đồ Hành trình Khám phá"></div>
      <header class="top-bar glass">
        <div class="brand"><div class="brand-mark">R<span>2</span></div><div><strong>R2PL 2027</strong><small>HÀNH TRÌNH KHÁM PHÁ</small></div></div>
        <div class="connection"><span id="connection-status" data-online="false" role="status">Đang kết nối…</span><button id="retry-button" type="button" hidden>Kết nối lại</button></div>
      </header>
      <section class="tile-panel glass" aria-label="Ô tri thức đang chọn" hidden>
        <div class="tile-panel-header"><p class="eyebrow">Ô TRI THỨC</p><button id="tile-close" class="context-close" aria-label="Đóng thông tin ô">×</button></div>
        <h2 id="tile-coordinates">Ô tri thức</h2><span id="tile-badge" class="badge-tag"></span>
        <p id="tile-knowledge"></p>
        <button id="explore-button" type="button" disabled>Khám phá</button>
        <p id="action-status" role="status" data-kind="normal"></p>
      </section>
    </main>
    <nav class="map-tools" aria-label="Điều hướng bản đồ">
      <button id="landmark-button" type="button" title="Đến công trình (L)" aria-label="Đến công trình">◆</button>
      <button id="overview-button" type="button" title="Toàn bản đồ (O)" aria-label="Toàn bản đồ">▦</button>
      <button id="camera-button" type="button" title="Đổi góc nhìn (I)" aria-label="Đổi góc nhìn">◇</button>
    </nav>
    <template id="dev-tools-template">
      <aside class="identity glass"><p class="eyebrow">CÔNG CỤ THỬ NGHIỆM</p><h1 id="school-name"></h1><label for="player-select">Tài khoản thử nghiệm</label><select id="player-select" aria-label="Chọn tài khoản thử nghiệm"></select></aside>
      <section class="resources glass"><div><p class="eyebrow">SỐ DƯ THỬ NGHIỆM</p><strong id="balance">—</strong><small id="player-name"></small></div><span id="explore-cost"></span></section>
      <section class="activity-panel glass"><p class="eyebrow">NHẬT KÝ <b id="pending-count">0</b></p><ul id="activity-list"></ul></section>
      <footer class="status-strip glass"><span id="strip-hover"></span><span><b id="viewport-count">0</b> vùng đang theo dõi</span></footer>
    </template>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
